name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Standalone HTML to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp public/standalone_remote.html android/app/src/main/assets/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build APK with Gradle
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Poco-Remote-IR.apk
          ls -lh Poco-Remote-IR.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Poco-Remote-IR-APK
          path: Poco-Remote-IR.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "📱 Poco Universal IR Remote v1.0.0 (APK)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Poco Universal IR Remote & QWERTY Keyboard
            
            Aplikasi Android APK native untuk HP Poco & Xiaomi yang memanfaatkan modul **IR Blaster fisik** (ConsumerIrManager) untuk mengontrol Smart TV & Monitor PC secara langsung.

            ### 🚀 Cara Download & Instal di HP:
            1. Download file **`Poco-Remote-IR.apk`** di bagian **Assets** di bawah.
            2. Buka file yang telah didownload di HP Poco/Xiaomi Anda.
            3. Jika muncul peringatan *"Izinkan instal dari sumber ini"*, pilih **Izinkan/Allow**.
            4. Buka aplikasi **Poco IR Remote**, arahkan sensor IR di atas HP ke TV/Monitor Anda!

            ---

            ### 📺 Fitur Utama:
            * **Dukungan Hardware IR Blaster**: Memancarkan sinyal inframerah fisik via `ConsumerIrManager` (38 kHz - 40 kHz).
            * **Dukungan Multi-Brand**:
              * **Toshiba**: REGZA (CT-Series, Addr `0x40BF`) & Android TV (C350 / M550, Addr `0xBF40`).
              * **Samsung, LG, Sony, Xiaomi, Polytron, TCL, Sharp, Hisense, Coocaa, Panasonic**.
              * **Monitor PC**: ASUS, HP, Lenovo, Dell, BenQ, Acer.
            * **QWERTY Virtual Keyboard**: Ngetik di YouTube TV & Browser TV tanpa repot geser panah satu-satu.
            * **Offline 100%**: Tidak memerlukan koneksi internet untuk mengontrol TV.
          files: Poco-Remote-IR.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
