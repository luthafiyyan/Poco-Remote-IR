<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#090c14"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="50%" stop-color="#FFCE00"/>
      <stop offset="100%" stop-color="#E5A800"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="rgba(255,206,0,0.3)" stroke-width="2"/>

  <!-- Glowing IR Signal Waves -->
  <path d="M196 110 A 100 100 0 0 1 316 110" fill="none" stroke="url(#yellowGrad)" stroke-width="14" stroke-linecap="round" opacity="0.4"/>
  <path d="M166 80 A 140 140 0 0 1 346 80" fill="none" stroke="url(#yellowGrad)" stroke-width="16" stroke-linecap="round" opacity="0.75" filter="url(#glow)"/>
  <path d="M136 50 A 180 180 0 0 1 376 50" fill="none" stroke="url(#yellowGrad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>

  <!-- IR Emitter Diode Top -->
  <circle cx="256" cy="140" r="22" fill="#FF3B30" filter="url(#glow)"/>
  <circle cx="256" cy="140" r="14" fill="#FFFFFF"/>

  <!-- Remote Chassis Body -->
  <rect x="136" y="160" width="240" height="310" rx="48" fill="#171C28" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  
  <!-- D-Pad Outer Ring -->
  <circle cx="256" cy="275" r="62" fill="#0C101A" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  
  <!-- Center OK Button (Poco Yellow) -->
  <circle cx="256" cy="275" r="30" fill="url(#yellowGrad)" filter="url(#glow)"/>
  <text x="256" y="281" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="900" fill="#000000" text-anchor="middle">OK</text>

  <!-- D-Pad Arrows -->
  <polygon points="256,224 246,238 266,238" fill="#FFFFFF" opacity="0.8"/>
  <polygon points="256,326 246,312 266,312" fill="#FFFFFF" opacity="0.8"/>
  <polygon points="205,275 219,265 219,285" fill="#FFFFFF" opacity="0.8"/>
  <polygon points="307,275 293,265 293,285" fill="#FFFFFF" opacity="0.8"/>

  <!-- Keyboard QWERTY Keys Emblem at Bottom -->
  <g fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5">
    <rect x="166" y="362" width="22" height="18" rx="4"/>
    <rect x="194" y="362" width="22" height="18" rx="4"/>
    <rect x="222" y="362" width="22" height="18" rx="4"/>
    <rect x="250" y="362" width="22" height="18" rx="4"/>
    <rect x="278" y="362" width="22" height="18" rx="4"/>
    <rect x="306" y="362" width="22" height="18" rx="4"/>
    <rect x="334" y="362" width="22" height="18" rx="4"/>

    <rect x="180" y="386" width="24" height="18" rx="4"/>
    <rect x="210" y="386" width="92" height="18" rx="4" fill="rgba(255,206,0,0.3)" stroke="rgba(255,206,0,0.6)"/>
    <rect x="308" y="386" width="24" height="18" rx="4"/>
  </g>

  <!-- Poco Yellow Tag Line -->
  <rect x="216" y="430" width="80" height="6" rx="3" fill="url(#yellowGrad)"/>
</svg>
